<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src blob:">
<title>Claude 播报</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="card">
  <header class="bar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l1.6 6.1 5.9-2.4-4.3 4.8 5.3 3.4-6.3.3.9 6.3L12 15.6 8.9 21l.9-6.3-6.3-.3 5.3-3.4-4.3-4.8 5.9 2.4z"/></svg>
      <span id="brand-name">Claude 播报</span>
      <span id="speaking-dot" class="speaking-dot" hidden></span>
      <span id="status" class="status"></span>
    </div>
    <div class="actions">
      <button id="btn-stop" class="icon" title="停止朗读 (Esc)" hidden>
        <svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
      </button>
      <button id="btn-pin" class="icon" title="置顶">
        <svg viewBox="0 0 24 24"><path d="M15 3l6 6-3 1-4 4 .5 4.5L13 20l-4-4-5 5-1-1 5-5-4-4 1.5-1.5L10 10l4-4z"/></svg>
      </button>
      <button id="btn-collapse" class="icon" title="收起">
        <svg viewBox="0 0 24 24"><path d="M6 12h12" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button id="btn-close" class="icon" title="隐藏（托盘里可以重新打开或退出）">
        <svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <!-- 左侧目录栏：quick-dirs 生成 + 末尾「其他」兜底，竖排常驻 -->
  <div class="shell">
    <nav id="dir-rail" class="dir-rail" aria-label="目录"></nav>
    <main id="view" class="view">
    <div id="dir-body" class="dir-body">
      <!-- 会话区：收放行冻结置顶，右侧 ＋ 在这个目录起新会话；任务单面板已是官方扩展（exts/todos） -->
      <div class="strip-head sess-head">
        <button id="sess-toggle" class="strip-toggle" type="button" title="展开/收起会话">
          <svg id="sess-caret" class="strip-caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="strip-title">会话</span>
          <span id="sess-count" class="strip-count" hidden></span>
        </button>
        <button id="session-new" class="strip-plus" type="button" title="在这个目录起新会话" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="list-wrap" class="list-wrap">
        <ul id="list" class="list"></ul>
        <div id="empty" class="empty" hidden>
          <svg class="empty-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l1.6 6.1 5.9-2.4-4.3 4.8 5.3 3.4-6.3.3.9 6.3L12 15.6 8.9 21l.9-6.3-6.3-.3 5.3-3.4-4.3-4.8 5.9 2.4z"/></svg>
          <span id="empty-text">还没有找到会话记录</span>
        </div>
      </div>

      <!-- 扩展面板：已注册扩展（node ext.js add）各占一条收放行，本体只渲染扩展吐的固定视图词汇 -->
      <div id="ext-panels" class="ext-panels"></div>
    </div>

    </main>
  </div>

  <form id="composer" class="composer" hidden>
    <div class="to">回复 <b id="composer-title"></b></div>
    <textarea id="composer-input" rows="2" placeholder="Enter 发送 · Shift+Enter 换行 · Esc 取消"></textarea>
    <div class="row">
      <span id="composer-status" class="composer-status"></span>
      <button type="button" id="composer-cancel" class="text-btn">取消</button>
      <button type="submit" id="composer-send" class="send-btn">发送</button>
    </div>
  </form>

  <!-- 状态栏：设置藏弹层（低频不常驻）；用量行已是官方扩展（exts/usage） -->
  <footer id="statusbar" class="statusbar">
    <button id="btn-settings" class="icon settings-btn" type="button" title="声音与语速">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <div id="settings-pop" class="settings-pop" hidden>
      <div class="pop-row">
        <span class="pop-label">形态</span>
        <div id="mode-switch" class="seg" title="切换会话来源">
          <button id="mode-claude" type="button" class="on">Claude</button>
          <button id="mode-codex" type="button">Codex</button>
        </div>
      </div>
      <div class="pop-row">
        <span class="pop-label">朗读</span>
        <div id="speak-switch" class="seg seg-mini" title="会话行上的朗读按钮，默认隐藏">
          <button id="speak-on" type="button">显示</button>
          <button id="speak-off" type="button" class="on">隐藏</button>
        </div>
      </div>
      <div class="pop-row">
        <span class="pop-label">回复</span>
        <div id="reply-switch" class="seg seg-mini" title="会话行上的快速回复按钮，默认隐藏">
          <button id="reply-on" type="button">显示</button>
          <button id="reply-off" type="button" class="on">隐藏</button>
        </div>
      </div>
      <div class="pop-row">
        <span class="pop-label">声音</span>
        <span class="select-wrap"><select id="voice" title="声音"></select></span>
      </div>
      <div class="pop-row">
        <span class="pop-label">语速</span>
        <input id="rate" type="range" min="0.7" max="2" step="0.1">
        <span id="rate-val"></span>
      </div>
    </div>
  </footer>
</div>
<script src="speech-text.js"></script>
<script src="tabs.js"></script>
<script src="renderer.js"></script>
</body>
</html>
